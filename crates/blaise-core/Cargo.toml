bench = false

[dependencies]
gtfs-bin-core.workspace = true
jiff.workspace = true
rayon.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
gtfs-bin-compiler.workspace = true
gtfs-rt.workspace = true
memmap2.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# A route query timed forward and backward on a real network: `just bench`.
[[bench]]
name = "route"
harness = false
