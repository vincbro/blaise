[package]
name = "blaise-core"
description = "A fast, local-first transit router over a compiled GTFS file: RAPTOR with walking, transfers and GTFS-realtime delays."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["transit", "gtfs", "routing-engine", "raptor", "public-transport"]
