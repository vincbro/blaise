[workspace]
resolver = "3"
members = ["crates/*"]

# Every crate is versioned in lockstep from here: `just bump <version>`.
[workspace.package]
version = "0.3.0"
authors = ["Vincent Brodin <vincent.brodin21@gmail.com>"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vincbro/blaise"
readme = "README.md"

# Internal crates require their exact sibling version, so a published blaise never
# mixes with another release's blaise-core. Cargo can't inherit a version here, so
# `just bump` rewrites these with [workspace.package]; a mismatch fails to build.
[workspace.dependencies]
anyhow = "1.0.104"
blaise-core = { path = "crates/blaise-core", version = "=0.3.0" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
flatnet-compiler = { version = "0.2.0", path = "../flatnet/crates/flatnet-compiler" }
flatnet-core = { version = "0.2.0", path = "../flatnet/crates/flatnet-core" }
gtfs-rt = "0.5.0"
jiff = "0.2.46"
memmap2 = "0.9.10"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rayon = "1.11.0"
tempfile = "3.26.0"
thiserror = "2.0.17"

[workspace.lints.rust]
# Off-by-default rustc lints we want on.
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
future_incompatible = "warn"
impl_trait_redundant_captures = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"                            # S-VISIBILITY
unreachable_pub = "warn"                             # S-VISIBILITY
# S-UNSAFE: each site opts in with #[allow(unsafe_code, reason = "...")].
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

# all, pedantic and cargo are on. restriction is opted into lint by lint
# instead of as a group: the group holds lints that contradict each other and
# grows with every toolchain.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Allowed from the groups above.
missing_errors_doc = "allow"      # errors are typed enums (S-ERRORS), their variants say how a call fails
multiple_crate_versions = "allow" # we don't control our dependencies' trees

# Opted in from restriction.
# Leftovers that shouldn't ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
mem_forget = "warn"
# S-PANICS: expect() with the invariant is allowed; unwrap() and panic!() are fine in tests (clippy.toml).
get_unwrap = "warn"
panic = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
# S-UNSAFE: unsafe stays rare and explained.
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# S-QUALIFIED-FNS: `mem::swap`, not `std::mem::swap` (clippy.toml).
absolute_paths = "warn"
# S-NAMES-ABBREVIATIONS: single letters outside the allowed set (clippy.toml).
min_ident_chars = "warn"
# S-FIELDS: a struct's fields are all pub or all private.
partial_pub_fields = "warn"
# S-DOCS: doc comments are sentences.
doc_paragraphs_missing_punctuation = "warn"
# S-TESTS: unit tests live in `mod tests`, named for the behavior.
redundant_test_prefix = "warn"
tests_outside_test_module = "warn"
# Clarity.
clone_on_ref_ptr = "warn"
lossy_float_literal = "warn"
mod_module_files = "warn"                # foo.rs + foo/, never foo/mod.rs
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

# Opted in from nursery, one by one like restriction.
use_self = "warn" # `Self { .. }`, not the type's name, inside its impl

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
